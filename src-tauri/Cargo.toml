[package]
name = "pips"
version = "2.0.0"
description = "Morse Code Time Reminder"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
# This is an efficiency-focused rewrite: optimize for a small, fast binary.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
