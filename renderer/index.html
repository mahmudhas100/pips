<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morseo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Morse Code Display -->
    <div class="morse-display">
      <div id="morseHours" class="morse-line">−−−−−    •−−−−</div>
      <div id="morseMinutes" class="morse-line">−−−−−    −−−−−</div>
      <div id="morseSeconds" class="morse-line">−−−−−    −−−−−</div>
    </div>
    
    <!-- Numeric Time (Secondary) -->
    <div id="currentTime" class="time-text-small">00:00:00</div>

    <!-- Settings Panel -->
    <div class="settings-panel">
      <h2>Settings</h2>
      
      <!-- Master Toggle -->
      <div class="setting-row">
        <label for="masterToggle">Master Control</label>
        <label class="toggle-switch">
          <input type="checkbox" id="masterToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- Volume Slider -->
      <div class="setting-row">
        <label for="volumeSlider">Volume</label>
        <div class="volume-control">
          <input type="range" id="volumeSlider" min="0" max="100" value="50">
          <span id="volumeValue" class="volume-display">50%</span>
        </div>
      </div>

      <!-- Quarter Beeps Toggle -->
      <div class="setting-row">
        <label for="quarterBeeps">Quarter-Hour Beeps</label>
        <label class="toggle-switch">
          <input type="checkbox" id="quarterBeeps" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- Time Format Toggle -->
      <div class="setting-row">
        <span class="setting-label">Time Format</span>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="timeFormat" value="24hr" checked>
            <span>24hr</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="timeFormat" value="12hr">
            <span>12hr</span>
          </label>
        </div>
      </div>

      <!-- Test Morse Button -->
      <div class="setting-row">
        <button id="testMorseBtn" class="test-btn">Test Morse</button>
      </div>

      <!-- Status Indicator -->
      <div class="status-row">
        <span class="status-label">Status:</span>
        <span id="statusIndicator" class="status-active">Active</span>
      </div>
    </div>
  </div>

  <script src="../utils/morse-encoder.js"></script>
  <script src="audio-system.js"></script>
  <script src="time-scheduler.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
