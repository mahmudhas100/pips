<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morseo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Settings Icon (Top Right) - morphs between gear and X -->
    <div class="settings-icon" id="settingsIcon" title="Settings">
      <svg class="icon-gear" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="21" x2="4" y2="14"></line>
        <line x1="4" y1="10" x2="4" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12" y2="3"></line>
        <line x1="20" y1="21" x2="20" y2="16"></line>
        <line x1="20" y1="12" x2="20" y2="3"></line>
        <line x1="1" y1="14" x2="7" y2="14"></line>
        <line x1="9" y1="8" x2="15" y2="8"></line>
        <line x1="17" y1="16" x2="23" y2="16"></line>
      </svg>
      <svg class="icon-close" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>

    <!-- Morse Code Display -->
    <div class="morse-display">
      <div id="morseHours" class="morse-line">▬▬▬▬▬    ▪▬▬▬▬</div>
      <div id="morseMinutes" class="morse-line">▬▬▬▬▬    ▬▬▬▬▬</div>
      <div id="morseSeconds" class="morse-line">▬▬▬▬▬    ▬▬▬▬▬</div>
    </div>
    
    <!-- Numeric Time (Secondary) -->
    <div id="currentTime" class="time-text-small">00:00:00</div>
  </div>

  <!-- Settings Modal (Hidden by default) -->
  <div class="settings-modal" id="settingsModal">
    <div class="settings-modal-content">
      <div class="settings-body">
        <!-- Volume Slider -->
        <div class="setting-row">
          <label for="volumeSlider">Volume</label>
          <div class="volume-control">
            <input type="range" id="volumeSlider" min="0" max="100" value="50">
            <span id="volumeValue">50%</span>
          </div>
        </div>

        <!-- Quarter Beeps Toggle -->
        <div class="setting-row">
          <label for="quarterBeeps">Quarter-Hour Beeps</label>
          <label class="toggle-switch">
            <input type="checkbox" id="quarterBeeps" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>

        <!-- Time Format Toggle -->
        <div class="setting-row">
          <span class="setting-label">Time Format</span>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="timeFormat" value="24hr" checked>
              <span>24hr</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="timeFormat" value="12hr">
              <span>12hr</span>
            </label>
          </div>
        </div>

        <!-- Quiet Hours Toggle -->
        <div class="setting-row">
          <label for="quietHours">Quiet Hours (00:00-08:00)</label>
          <label class="toggle-switch">
            <input type="checkbox" id="quietHours">
            <span class="toggle-slider"></span>
          </label>
        </div>

        <!-- Auto-Launch Toggle -->
        <div class="setting-row">
          <label for="autoLaunch">Launch on Startup</label>
          <label class="toggle-switch">
            <input type="checkbox" id="autoLaunch">
            <span class="toggle-slider"></span>
          </label>
        </div>

        <!-- Status Indicator -->
        <div class="status-row">
          <span class="status-label">Status:</span>
          <span id="statusIndicator" class="status-badge status-active">Active</span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/morse-encoder.js"></script>
  <script src="js/audio-system.js"></script>
  <script src="js/renderer.js"></script>
</body>
</html>
